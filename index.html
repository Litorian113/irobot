<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HfG Köpfe</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Plain ES5 on purpose: old browsers stop at the app's syntax and stay black.
      // Tell whoever stands in front of the screen what to do instead.
      (function () {
        var webgl2 = false
        var modern = false
        try { webgl2 = !!document.createElement('canvas').getContext('webgl2') } catch (e) {}
        try { new Function('var a = {}; return a?.b ?? 1')(); modern = true } catch (e) {}
        if (webgl2 && modern) return
        var box = document.createElement('div')
        box.setAttribute('style', 'position:fixed;top:0;right:0;bottom:0;left:0;padding:8vh 8vw;background:#fff;color:#111;font:24px/1.4 Helvetica,Arial,sans-serif;z-index:99')
        box.innerHTML = '<h1 style="margin:0 0 0.6em;font-size:40px">Dieser Browser ist zu alt.</h1>'
          + '<p>Bitte diese Seite in <b>Firefox ESR 78</b> (oder Chrome 103) öffnen. Safari auf OS X 10.11 kann die 3D-Köpfe nicht darstellen.</p>'
          + '<p style="color:#666;font-size:18px">' + (webgl2 ? 'WebGL 2: ja' : 'WebGL 2: nein') + ' · ' + (modern ? 'JavaScript: ok' : 'JavaScript: zu alt') + '<br>' + navigator.userAgent + '</p>'
        document.body.appendChild(box)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
